server:
  # 端口
  port: 8080
spring:
  # 应用名称
  application:
    name: BlogApplication
  # mysql配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://121.41.87.40:3306/blog?serverTimezone=Asia/Shanghai&allowMultiQueries=true&rewriteBatchedStatements=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&connectTimeout=5000&socketTimeout=15000&tcpKeepAlive=true&autoReconnect=true
    username: root
    password: 1224
    druid:
      # 初始连接数
      initial-size: 10
      # 最小连接池数量
      min-idle: 20
      # 最大连接池数量
      max-active: 150
      # 配置获取连接等待超时的时间
      max-wait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 30000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      max-evictable-idle-time-millis: 600000
      # 配置检测连接是否有效
      validation-query: SELECT 1
      # 配置检测连接是否有效时间（秒）
      validation-query-timeout: 3
      # 在连接空闲时进行有效性检测
      test-while-idle: true
      # 从连接池获取连接时检查有效性
      test-on-borrow: true
      # 设置从连接池归还连接时是否检查连接有效性，true检查，false不检查
      test-on-return: false
      # 保活空闲连接，减少连接被服务端回收导致的断链
      keep-alive: true
  # 文件上传限制
  servlet:
    multipart:
      max-request-size: 100MB
      max-file-size: 100MB
  # redis配置 (Spring Boot 3.x: spring.data.redis.*)
  data:
    redis:
      # Redis服务器地址
      host: 121.41.87.40
      # Redis服务器连接端口
      port: 6379
      # Redis服务器连接密码（默认为空）
      password: 1224
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 150
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: 5000ms
          # 连接池中的最大空闲连接
          max-idle: 100
          # 连接池中的最小空闲连接
          min-idle: 50
      # Redis 数据库索引（默认为0）
      database: 0
  # rabbitmq配置
  rabbitmq:
    host: 121.41.87.40
    port: 5672
    username: wyp
    password: 1224
    listener:
      simple:
        retry:
          enabled: true
          # 重试间隔时间
          initial-interval: 3000
          # 最大重试次数
          max-attempts: 3
  # 邮箱配置
  mail:
    host: smtp.qq.com
    # 用户名
    username: 3169468598@qq.com
    # 授权码
    password: wzlhkpcerxlwddda
  web:
    resources:
      # 配置静态资源位置：优先读取源目录的图片，绕过 target
      static-locations:
        - file:D:\\IdeaProjects\\blog\\blog-springboot\\src\\main\\resources\\static\\  # 指向 static 根目录（包含 Wallhaven）
        - classpath:/static/  # 保留默认的 classpath 路径（可选，防止其他静态资源失效）
  # elasticsearch配置
  elasticsearch:
    uris: http://${ES_HOST:121.41.87.40}:${ES_PORT:9200}
    connection-timeout: 5s
    socket-timeout: 30s

