blog:
  url: 121.41.87.40
# 线程池配置
thread:
  pool:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 50
    keep-alive-seconds: 1000
# 搜索模式 可选 elasticsearch、mysql
search:
  mode: elasticsearch
# 文件上传策略 local、oss、cos
upload:
  strategy: local
  local:
    # nginx映射本地文件路径
    url: https://121.41.87.40/
    # 本地文件存储路径
    path: /usr/local/upload/
  # oss存储
  oss:
    url: https://wangyoupeng-penghong.oss-cn-beijing.aliyuncs.com/
    endpoint: oss-cn-beijing.aliyuncs.com
    bucketName: wangyoupeng-penghong
    accessKeyId: ${oss.accessKeyId}
    accesskeySecret: ${oss.accesskeySecret}

# MyBatis-Plus 配置
mybatis-plus:
  # mapper映射地址
  mapper-locations: classpath:mapper/*.xml
  # 实体类扫描包路径
  type-aliases-package: com.ican.entity
  configuration:
    # sql打印
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 数据库表前缀
      table-prefix: t_
# Sa-Token 配置 (文档: https://sa-token.cc)
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # token前缀
  token-prefix: Bearer
  # token有效期，单位s 默认30天, -1代表永不过期
  timeout: 18000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  active-timeout: -1
  # 关闭自动续签
  auto-renew: false
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # token风格
  token-style: uuid
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # 同一账号最大登录数量
  max-login-count: 20
  # 是否从cookie中读取token
  is-read-cookie: true
  # 是否从请求体里读取token
  is-read-body: true
  # 是否从header中读取token
  is-read-header: true
  # 是否输出操作日志
  is-log: false

