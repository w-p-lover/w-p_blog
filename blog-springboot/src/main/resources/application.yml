server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:./config/application-private.yml
  application:
    name: BlogApplication
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BLOG_DB_URL:jdbc:mysql://127.0.0.1:3306/blog?serverTimezone=Asia/Shanghai&allowMultiQueries=true&rewriteBatchedStatements=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&connectTimeout=5000&socketTimeout=15000&tcpKeepAlive=true&autoReconnect=true}
    username: ${BLOG_DB_USERNAME:root}
    password: ${BLOG_DB_PASSWORD:}
    druid:
      initial-size: 10
      min-idle: 20
      max-active: 150
      max-wait: 60000
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 600000
      validation-query: SELECT 1
      validation-query-timeout: 3
      test-while-idle: true
      test-on-borrow: true
      test-on-return: false
      keep-alive: true
  servlet:
    multipart:
      max-request-size: 100MB
      max-file-size: 100MB
  data:
    redis:
      host: ${BLOG_REDIS_HOST:127.0.0.1}
      port: ${BLOG_REDIS_PORT:6379}
      password: ${BLOG_REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          max-active: 150
          max-wait: 5000ms
          max-idle: 100
          min-idle: 50
      database: ${BLOG_REDIS_DATABASE:0}
  rabbitmq:
    host: ${BLOG_RABBITMQ_HOST:127.0.0.1}
    port: ${BLOG_RABBITMQ_PORT:5672}
    username: ${BLOG_RABBITMQ_USERNAME:guest}
    password: ${BLOG_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
  mail:
    host: ${BLOG_MAIL_HOST:smtp.qq.com}
    username: ${BLOG_MAIL_USERNAME:}
    password: ${BLOG_MAIL_PASSWORD:}
  web:
    resources:
      static-locations:
        - file:${BLOG_STATIC_DIR:D:/IdeaProjects/blog/blog-springboot/src/main/resources/static/}
        - classpath:/static/
  elasticsearch:
    uris: ${BLOG_ES_URIS:http://127.0.0.1:9200}
    connection-timeout: 5s
    socket-timeout: 30s
  ai:
    openai:
      api-key: ${BLOG_OPENAI_API_KEY:}
      base-url: ${BLOG_OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${BLOG_OPENAI_CHAT_MODEL:deepseek-chat}
          temperature: ${BLOG_OPENAI_CHAT_TEMPERATURE:0.7}
    dashscope:
      api-key: ${BLOG_DASHSCOPE_API_KEY:}
      embedding:
        options:
          model: ${BLOG_DASHSCOPE_EMBED_MODEL:text-embedding-v3}
    vectorstore:
      qdrant:
        host: ${BLOG_QDRANT_HOST:127.0.0.1}
        port: ${BLOG_QDRANT_PORT:6334}
        collection-name: ${BLOG_QDRANT_COLLECTION:blog-articles}

hefeng:
  api-key: ${BLOG_HEFENG_API_KEY:}
  base-url: ${BLOG_HEFENG_BASE_URL:https://pe7byfyfwb.re.qweatherapi.com/}

blog:
  url: ${BLOG_SITE_HOST:127.0.0.1}
  site:
    base-url: ${BLOG_SITE_BASE_URL:http://127.0.0.1:${SERVER_PORT:8080}}
    frontend-url: ${BLOG_SITE_URL:http://127.0.0.1:5173}
    admin-url: ${BLOG_ADMIN_URL:http://127.0.0.1:5174}
    api-doc-url: ${BLOG_API_DOC_URL:http://127.0.0.1:${SERVER_PORT:8080}/doc.html}
  security:
    allowed-origins:
      - ${BLOG_CORS_ORIGIN_1:http://localhost:5173}
      - ${BLOG_CORS_ORIGIN_2:http://127.0.0.1:5173}
      - ${BLOG_CORS_ORIGIN_3:http://localhost:5174}
      - ${BLOG_CORS_ORIGIN_4:http://127.0.0.1:5174}
      - ${BLOG_CORS_ORIGIN_5:http://localhost:5175}
      - ${BLOG_CORS_ORIGIN_6:http://127.0.0.1:5175}
    websocket-allowed-origins:
      - ${BLOG_WS_ORIGIN_1:http://localhost:5173}
      - ${BLOG_WS_ORIGIN_2:http://127.0.0.1:5173}
  satoken:
    renew-threshold-seconds: ${BLOG_SATOKEN_RENEW_THRESHOLD_SECONDS:600}
    renew-timeout-seconds: ${BLOG_SATOKEN_RENEW_TIMEOUT_SECONDS:1800}

thread:
  pool:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 50
    keep-alive-seconds: 1000

search:
  mode: elasticsearch

upload:
  strategy: local
  local:
    url: ${BLOG_UPLOAD_LOCAL_URL:http://127.0.0.1:${SERVER_PORT:8080}/}
    path: ${BLOG_UPLOAD_LOCAL_PATH:/data/blog/upload/}
  oss:
    url: ${BLOG_OSS_URL:https://example-bucket.oss-cn-beijing.aliyuncs.com/}
    endpoint: ${BLOG_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucketName: ${BLOG_OSS_BUCKET_NAME:replace-me}
    accessKeyId: ${BLOG_OSS_ACCESS_KEY_ID:}
    accesskeySecret: ${BLOG_OSS_ACCESS_KEY_SECRET:}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ican.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      table-prefix: t_

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 18000
  active-timeout: -1
  auto-renew: false
  is-concurrent: true
  token-style: uuid
  is-share: false
  max-login-count: 20
  is-read-cookie: true
  is-read-body: true
  is-read-header: true
  is-log: false

spider:
  dir: ${BLOG_SPIDER_DIR:${user.dir}/src/main/resources/static/}
  python:
    cmd: ${BLOG_PYTHON_CMD:python}
  photo:
    album:
      id: 1

oauth:
  gitee:
    client-id: ${BLOG_GITEE_CLIENT_ID:}
    client-secret: ${BLOG_GITEE_CLIENT_SECRET:}
    grant-type: authorization_code
    redirect-url: ${BLOG_GITEE_REDIRECT_URL:http://localhost:5173/oauth/login/gitee}
    access-token-url: https://gitee.com/oauth/token
    user-info-url: https://gitee.com/api/v5/user?access_token={access_token}
  github:
    client-id: ${BLOG_GITHUB_CLIENT_ID:}
    client-secret: ${BLOG_GITHUB_CLIENT_SECRET:}
    redirect-url: ${BLOG_GITHUB_REDIRECT_URL:http://localhost:5173/oauth/login/github}
    access-token-url: https://github.com/login/oauth/access_token
    user-info-url: https://api.github.com/user
  qq:
    app-id: QQ的APPID
    check-token-url: https://graph.qq.com/oauth2.0/me?access_token={access_token}
    user-info-url: https://graph.qq.com/user/get_user_info?openid={openid}&access_token={access_token}&oauth_consumer_key={oauth_consumer_key}

cache:
  multilevel:
    local:
      max-size: ${BLOG_CACHE_L1_MAX_SIZE:1000}
      expire-minutes: ${BLOG_CACHE_L1_EXPIRE_MINUTES:5}
    bloom:
      expected-insertions: ${BLOG_CACHE_BLOOM_EXPECTED_INSERTIONS:1000000}
      false-probability: ${BLOG_CACHE_BLOOM_FALSE_PROBABILITY:0.01}
    null-cache-ttl-minutes: ${BLOG_CACHE_NULL_TTL_MINUTES:5}
    ttl-jitter-max-minutes: ${BLOG_CACHE_TTL_JITTER_MAX_MINUTES:5}
    lock:
      wait-seconds: ${BLOG_CACHE_LOCK_WAIT_SECONDS:3}
      lease-seconds: ${BLOG_CACHE_LOCK_LEASE_SECONDS:10}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %highlight(%-5level) %magenta(${PID:- }) --- [%t] %cyan(%-40.40logger{39}) : %m%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true

ai:
  rag:
    top-k: 5
    segment-size: 500
    segment-overlap: 50

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  setting:
    language: zh_cn

captcha:
  init-default-resource: true
